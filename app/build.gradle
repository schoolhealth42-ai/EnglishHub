plugins {
    id 'com.android.application'
}

android {
    namespace 'com.englishhub.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.englishhub.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'englishhub2026'
            keyAlias 'englishhub'
            keyPassword 'englishhub2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
